name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile heartbeat script
        run: python -m py_compile scripts/heartbeat.py
      - name: Exercise command-line entry point
        run: python scripts/heartbeat.py --help
      - name: Verify medical safety section is present
        run: grep -F "## 二、医疗安全边界" SKILL.md
      - name: Reject the former NRT prohibition
        run: "! grep -F '严禁任何“尼古丁替代品”（NRT）建议' SKILL.md"
